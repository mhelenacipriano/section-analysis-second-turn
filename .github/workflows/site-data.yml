name: site-data

# Keeps the website's data files (web/public/data/*.json) in sync with the repo. The site itself is
# hosted on Vercel, which redeploys on every push to main, so committing refreshed data is what
# updates the live site. Runs when a closing-time scan finishes, when the first-turn data or the
# data builder changes, or by hand.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [tse-encerramento]
    types: [completed]
  push:
    branches: [main]
    paths: ["data/**", "scripts/build_site_data.py", "scripts/clocks.py", ".github/workflows/site-data.yml"]

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the data files
        run: |
          if ! ls state_enc/done_*.txt > /dev/null 2>&1; then
            echo "::notice::state_enc/ is empty (run tse-encerramento first); nothing to build"
            exit 0
          fi
          pip install pandas
          python scripts/build_site_data.py

      - name: Commit if the data changed
        run: |
          # meta.json carries a timestamp: it alone must not trigger a commit (and a redeploy)
          if git diff --quiet -- web/public/data ':!web/public/data/meta.json' && [ -z "$(git ls-files --others --exclude-standard web/public/data)" ]; then
            git checkout -- web/public/data/meta.json 2>/dev/null || true
            echo "Data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          git commit -m "site-data: refresh the website data"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs
          done
          exit 1
