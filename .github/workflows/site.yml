name: site

# Builds the dashboard (web/) and publishes it to GitHub Pages.
# The data files the site reads are generated here from the committed inputs
# (data/t1, state_enc, results_enc, data/tse_ibge.csv), so the site always matches the repo.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "scripts/build_site_data.py", "data/**", ".github/workflows/site.yml"]
  workflow_run:                       # republish when a closing-time scan finishes and commits
    workflows: [tse-encerramento]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the data files
        run: |
          pip install pandas
          python scripts/build_site_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the site
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
