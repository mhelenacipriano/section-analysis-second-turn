name: site

# Builds the dashboard (web/) and publishes it to GitHub Pages.
# The data files the site reads are generated here from the committed inputs
# (data/t1, state_enc, results_enc, data/tse_ibge.csv), so the site always matches the repo.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "scripts/build_site_data.py", "data/**", ".github/workflows/site.yml"]
  workflow_run:                       # republish when a closing-time scan finishes and commits
    workflows: [tse-encerramento]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.chk.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # nothing to publish until the closing-time scan has committed its first results
      - name: Check that the scan has produced data
        id: chk
        run: |
          if ls state_enc/done_*.txt > /dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::state_enc/ is empty (run tse-encerramento first); nothing to publish"
          fi

      - uses: actions/setup-python@v5
        if: steps.chk.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Build the data files
        if: steps.chk.outputs.ok == 'true'
        run: |
          pip install pandas
          python scripts/build_site_data.py

      - uses: actions/setup-node@v4
        if: steps.chk.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the site
        if: steps.chk.outputs.ok == 'true'
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
        if: steps.chk.outputs.ok == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.chk.outputs.ok == 'true'
        with:
          path: web/dist

  deploy:
    needs: build
    if: needs.build.outputs.ok == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
